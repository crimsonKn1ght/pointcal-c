# M/full tier: all 15 corruptions x 5 severities plus clean, all evaluation
# objects. Launch ONLY after the S tier passes its gates.
#
# Whole-project accounting (worst case, nothing reused):
#   XS 0.5 + S 2.0 + full 3.4 = 5.9 GPU-hours  (cap: 6.0)
#   $0.15 + $0.54 + $0.92     = $1.61          (expected A5000 ceiling: $1.62)
# The absolute fallback-hardware ceiling of $3.60 stays untouched.
tier: full
device: cuda
seed: 20260809
run_dir: runs/full

data:
  root: data/modelnet40c
  split_file: artifacts/split.json
  max_objects: null
  max_calibration_objects: null

projection:
  # See configs/s.yaml: 1024 objects x 6 views per CLIP forward.
  batch_size: 1024

model:
  precision: fp16
  cache_dir: .cache/open_clip
  # Pinned 2026-08-16 from the first successful download; a mismatch now aborts.
  pinned_checkpoint_sha256: 1bd3c7172de5b207ceac554f5ab5266166f3b9baccc9af5989bc801016d080ad

conditions:
  include_clean: true
  corruptions:
    - occlusion
    - lidar
    - density_inc
    - density
    - cutout
    - uniform
    - gaussian
    - impulse
    - upsampling
    - background
    - rotation
    - shear
    - distortion
    - distortion_rbf
    - distortion_rbf_inv
  severities: [1, 2, 3, 4, 5]

evaluation:
  # Reduced from 1000 on 2026-08-16. At 1000 the CPU bootstrap over 76
  # conditions runs ~2 h against ~5 min of GPU work; 200 matches the XS tier and
  # brings the tier in at ~30 min. The logit cache is unaffected, so deeper
  # intervals can be recomputed later for free (docs/compute_contract.md).
  bootstrap_samples: 200
  bootstrap_seed: 7

budget:
  # See configs/s.yaml. 3.4 GPU-h at $0.28/hr would cost $0.95 and breach the
  # $0.92 gate; the hour ceiling is tightened to 3.2 ($0.90) instead.
  gpu: RTX 4000 Ada
  max_gpu_hours: 3.2
  max_usd: 0.92
  max_wall_hours: 4.0
  max_vram_gb: 20.0
  max_ram_gb: 25.0
