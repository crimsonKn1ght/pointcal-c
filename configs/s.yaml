# S tier: all evaluation objects, four representative corruptions x three
# severities (one corruption from each family plus a second density case).
# Gate: <= 2 GPU-hours and <= $0.54 on the A5000. Full only runs if this passes.
tier: s
device: cuda
seed: 20260809
run_dir: runs/s

data:
  root: data/modelnet40c
  split_file: artifacts/split.json
  max_objects: null            # every evaluation object
  max_calibration_objects: null

projection:
  batch_size: 64

model:
  precision: fp16
  cache_dir: .cache/open_clip
  pinned_checkpoint_sha256: null

conditions:
  include_clean: true
  corruptions: [gaussian, cutout, rotation, lidar]   # constants.S_TIER_CORRUPTIONS
  severities: [1, 3, 5]                              # constants.S_TIER_SEVERITIES

evaluation:
  bootstrap_samples: 500
  bootstrap_seed: 7

budget:
  gpu: RTX A5000
  max_gpu_hours: 2.0
  max_usd: 0.54
  max_wall_hours: 4.0
  max_vram_gb: 20.0
  max_ram_gb: 25.0
