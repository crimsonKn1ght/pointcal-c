# XS tier: 100 evaluation objects, clean + two corruptions x two severities.
# Gate: <= 0.5 GPU-hour and <= $0.15 on the A5000.
# This is the tier the acceptance criteria require a fresh pod to reproduce.
tier: xs
device: cuda
seed: 20260809
run_dir: runs/xs

data:
  root: data/modelnet40c
  split_file: artifacts/split.json
  max_objects: 100
  max_calibration_objects: 100

projection:
  # 256 objects x 6 views = 1536 images per CLIP forward. Raised from 64 on
  # 2026-08-16 to actually feed the GPU; batching cannot change the frozen
  # forward pass (ViT uses LayerNorm, not BatchNorm), only throughput.
  batch_size: 256

model:
  precision: fp16
  cache_dir: .cache/open_clip
  # Pinned 2026-08-16 from the first successful download; a mismatch now aborts.
  pinned_checkpoint_sha256: 1bd3c7172de5b207ceac554f5ab5266166f3b9baccc9af5989bc801016d080ad

conditions:
  include_clean: true
  corruptions: [gaussian, cutout]   # constants.XS_TIER_CORRUPTIONS
  severities: [1, 5]                # constants.XS_TIER_SEVERITIES

evaluation:
  bootstrap_samples: 200
  bootstrap_seed: 7

budget:
  gpu: RTX 4000 Ada       # substituted 2026-08-16: A5000/3090 out of capacity
  max_gpu_hours: 0.5
  max_usd: 0.15
  max_wall_hours: 4.0
  max_vram_gb: 20.0
  max_ram_gb: 25.0
